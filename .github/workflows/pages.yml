# 推送到 main 時：跑測試 → 建置 → 更新 Apps Script 後台（有設定 Secret 時）→ 把雲端版網頁（dist/web/）發布到 GitHub Pages。
# 第一次使用前，請到 GitHub 的 Settings → Pages，Source 選「GitHub Actions」。
# 自動更新後台需要 Secret：CLASPRC_JSON、GAS_SCRIPT_ID、GAS_DEPLOYMENT_ID（見 docs/deploy-gas.md）；沒有設定時略過。
# 後台更新失敗時不發布網頁，避免網頁比後台新。
name: 發布網頁

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 測試
        run: npm test
      - name: 建置
        run: npm run build
      - name: 更新後台（Apps Script）
        run: node scripts/deploy-gas.js
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
