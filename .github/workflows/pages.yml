# 推送到 main 時：跑測試 → 建置 → 把雲端版網頁（dist/web/）發布到 GitHub Pages。
# 第一次使用前，請到 GitHub 的 Settings → Pages，Source 選「GitHub Actions」。
# 這個流程只發布網頁，不會碰 Google Apps Script（後台用 clasp push 更新，見 docs/deploy-gas.md）。
name: 發布網頁

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 測試
        run: npm test
      - name: 建置
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
