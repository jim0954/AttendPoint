# 推送到 main 時：跑測試 → 建置 → 更新 Apps Script 後台（有設定 Secret 時）→ 把雲端版網頁（dist/web/）發布到 GitHub Pages。
# 第一次使用前，請到 GitHub 的 Settings → Pages，Source 選「GitHub Actions」。
# 自動更新後台需要 Secret：CLASPRC_JSON、GAS_SCRIPT_ID、GAS_DEPLOYMENT_ID（見 docs/deploy-gas.md）；沒有設定時略過。
# 後台更新失敗時不發布網頁，避免網頁比後台新。
# 使用的 actions 固定到 commit SHA（註解為對應的版本標籤），避免標籤被改指到其他程式碼；要升級時一併更新 SHA。
name: 發布網頁

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 測試
        run: npm test
      - name: 建置
        run: npm run build
      - name: 更新後台（Apps Script）
        run: node scripts/deploy-gas.js
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
